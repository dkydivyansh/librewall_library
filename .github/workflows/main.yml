name: Automate Librewall Library

on:
  push:
    paths:
      - 'wallpapers/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-wallpapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update Script
        run: |
          python .github/scripts/update_library.py
        env:
          # This maps the Repository Secret to the Python Environment Variable
          API_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
